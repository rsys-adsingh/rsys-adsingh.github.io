<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 1440 620" role="img" aria-labelledby="title desc">
<title id="title">One ELF byte, three address coordinates</title><desc id="desc">In an illustrative Linux PIE, file offset 0x3050 corresponds to ELF virtual address 0x4050. Adding load bias 0x555555554000 gives runtime VA 0x555555558050. This example segment starts at file offset 0x2db0 and ELF VA 0x3db0.</desc>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#244361" stroke-opacity=".3"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#5d8ba2" stroke-width="1.2"/></marker></defs>
<rect width="1440" height="620" rx="14" fill="#0b1423"/><rect width="1440" height="620" rx="14" fill="url(#grid)"/>
<g font-family="Consolas,monospace"><text x="54" y="61" font-size="15" letter-spacing="3" fill="#67e8f9">THE LINUX ADDRESS MAP</text><text x="54" y="110" font-size="34" font-weight="bold" fill="#edf6ff">One byte. Three coordinates.</text><text x="54" y="145" font-size="17" fill="#91a9c4">Follow one file-backed byte from an ELF file into a running process.</text>
<rect x="54" y="196" width="350" height="230" rx="10" fill="#141b34" stroke="#6556a1"/><rect x="545" y="196" width="350" height="230" rx="10" fill="#0b2935" stroke="#28788a"/><rect x="1036" y="196" width="350" height="230" rx="10" fill="#102d29" stroke="#338a76"/>
<g fill="none" stroke-width="2"><path d="M84 236H131V266H84Z M94 245H120 M94 254H115" stroke="#bbabff"/><path d="M576 238H623V265H576Z M586 229V238 M600 229V238 M614 229V238 M586 265V274 M600 265V274 M614 265V274" stroke="#67e8f9"/><path d="M1067 237H1114V268H1067Z M1067 259H1114 M1090 268V278 M1079 278H1102" stroke="#70e7bc"/></g>
<text x="84" y="306" font-size="16" fill="#bbabff">FILE OFFSET</text><text x="84" y="352" font-size="36" fill="#e5ddff">0x3050</text><text x="84" y="390" font-size="15" fill="#a0abc4">Position in the file</text>
<text x="575" y="306" font-size="16" fill="#67e8f9">ELF VIRTUAL ADDRESS</text><text x="575" y="352" font-size="36" fill="#c6f7ff">0x4050</text><text x="575" y="390" font-size="15" fill="#a0c4cf">RVA for this zero-origin PIE</text>
<text x="1066" y="306" font-size="16" fill="#70e7bc">RUNTIME VIRTUAL ADDRESS</text><text x="1066" y="352" font-size="24" fill="#c9ffee">0x555555558050</text><text x="1066" y="390" font-size="15" fill="#a0c4bc">Address in the process</text>
<path d="M416 312H529" fill="none" stroke="#5d8ba2" stroke-width="2" marker-end="url(#arrow)"/><path d="M907 312H1020" fill="none" stroke="#5d8ba2" stroke-width="2" marker-end="url(#arrow)"/>
<text x="474" y="288" text-anchor="middle" font-size="13" fill="#abc3da">PT_LOAD</text><text x="964" y="288" text-anchor="middle" font-size="13" fill="#abc3da">+ load bias</text>
<path d="M54 474H1386" stroke="#294159"/><text x="54" y="513" font-size="16" fill="#9cb4ce">SEGMENT</text><text x="230" y="513" font-size="17" fill="#d5e6fa">p_offset 0x2db0 / p_vaddr 0x3db0 / target delta 0x2a0</text><text x="54" y="552" font-size="16" fill="#9cb4ce">LOAD BIAS</text><text x="230" y="552" font-size="17" fill="#67e8f9">0x555555554000 + 0x4050 = 0x555555558050</text><text x="54" y="590" font-size="12" fill="#7893af">ILLUSTRATIVE VALUES / not to scale / the file-to-ELF translation depends on the owning segment</text>
</g></svg>