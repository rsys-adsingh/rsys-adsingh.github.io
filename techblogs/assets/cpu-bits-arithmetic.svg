<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="650" viewBox="0 0 1440 650" role="img" aria-labelledby="title desc"><title id="title">Multiword arithmetic versus a wider register operation</title><desc id="desc">Adding one to hexadecimal FFFFFFFF produces the 64-bit value 0000000100000000. With 32-bit registers, the low half wraps and a carry increments the high half. A 64-bit register operation can represent the full width directly. This is schematic, not a performance benchmark.</desc><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#29405b" stroke-opacity=".3"/></pattern></defs><rect width="1440" height="650" fill="#0b1423"/><rect width="1440" height="650" fill="url(#grid)"/><g font-family="Consolas,monospace"><text x="54" y="58" fill="#67e8f9" font-size="15" text-anchor="start">THE SAME UNSIGNED 64-BIT VALUE</text><text x="54" y="111" fill="#edf6ff" font-size="33" text-anchor="start">4,294,967,295 + 1 = 4,294,967,296</text><rect x="54" y="164" width="610" height="352" rx="8" fill="#10283b" stroke="#3b687e"/><rect x="776" y="164" width="610" height="352" rx="8" fill="#211d37" stroke="#67588e"/><text x="84" y="210" fill="#67e8f9" font-size="24" text-anchor="start">Using 32-bit general registers</text><text x="806" y="210" fill="#c4b5fd" font-size="24" text-anchor="start">Using a 64-bit general register</text><text x="84" y="258" fill="#9db2cc" font-size="18" text-anchor="start">Initial high half / low half</text><text x="84" y="299" fill="#edf6ff" font-size="25" text-anchor="start">00000000          FFFFFFFF</text><text x="84" y="345" fill="#67e8f9" font-size="19" text-anchor="start">Low half + 1: 00000000, carry 1</text><text x="84" y="384" fill="#67e8f9" font-size="19" text-anchor="start">High half + carry: 00000001</text><text x="84" y="448" fill="#70e7bc" font-size="24" text-anchor="start">Result: 00000001 00000000</text><text x="806" y="258" fill="#9db2cc" font-size="18" text-anchor="start">Initial register</text><text x="806" y="300" fill="#edf6ff" font-size="28" text-anchor="start">00000000FFFFFFFF</text><text x="806" y="352" fill="#c4b5fd" font-size="21" text-anchor="start">Add 1 at 64-bit width</text><text x="806" y="448" fill="#70e7bc" font-size="24" text-anchor="start">Result: 0000000100000000</text><text x="54" y="572" fill="#9db2cc" font-size="19" text-anchor="start">A compiler can implement a 64-bit C integer with multiple 32-bit operations.</text><text x="54" y="617" fill="#9db2cc" font-size="13" text-anchor="start">Schematic arithmetic, not a timing comparison. Constant expressions may be folded by a compiler.</text></g></svg>