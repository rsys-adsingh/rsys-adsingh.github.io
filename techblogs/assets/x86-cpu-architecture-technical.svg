<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc"><title id="title">A simplified modern x86 CPU architecture</title><desc id="desc">An enlarged core shows fetch, decode to micro-operations, scheduling, execution, and retirement. Registers and L1 cache are close to the execution machinery. Other cores, core-local L2 caches, shared last-level cache, and memory and device interfaces form the processor. Physical layouts and cache sharing differ by model.</desc><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#29405b" stroke-opacity=".3"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#6c94ac" stroke-width="1.2"/></marker></defs><rect width="1440" height="820" rx="14" fill="#0b1423"/><rect width="1440" height="820" fill="url(#grid)"/><g font-family="Consolas,monospace"><text x="54" y="57" fill="#67e8f9" font-size="15" text-anchor="start">INSIDE A MODERN x86 CPU</text><text x="54" y="110" fill="#edf6ff" font-size="32" text-anchor="start">Read instructions, find ready work, execute.</text><rect x="54" y="160" width="1332" height="530" rx="8" fill="#0c1c2c" stroke="#34536c"/><rect x="80" y="193" width="1020" height="296" rx="8" fill="#10283b" stroke="#427b91"/><text x="108" y="230" fill="#67e8f9" font-size="21" text-anchor="start">One enlarged CPU core (simplified)</text><rect x="108" y="275" width="163" height="76" rx="8" fill="#17374c" stroke="#438098"/><text x="189" y="306" fill="#edf6ff" font-size="20" text-anchor="middle">Fetch</text><text x="189" y="332" fill="#9db2cc" font-size="12" text-anchor="middle">Read instructions</text><path d="M274 313L296 313" stroke="#6c94ac" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="301" y="275" width="163" height="76" rx="8" fill="#17374c" stroke="#438098"/><text x="382" y="306" fill="#edf6ff" font-size="20" text-anchor="middle">Decode</text><text x="382" y="332" fill="#9db2cc" font-size="12" text-anchor="middle">Form micro-ops</text><path d="M467 313L489 313" stroke="#6c94ac" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="494" y="275" width="163" height="76" rx="8" fill="#17374c" stroke="#438098"/><text x="575" y="306" fill="#edf6ff" font-size="20" text-anchor="middle">Schedule</text><text x="575" y="332" fill="#9db2cc" font-size="12" text-anchor="middle">Find ready work</text><path d="M660 313L682 313" stroke="#6c94ac" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="687" y="275" width="163" height="76" rx="8" fill="#17374c" stroke="#438098"/><text x="768" y="306" fill="#edf6ff" font-size="20" text-anchor="middle">Execute</text><text x="768" y="332" fill="#9db2cc" font-size="12" text-anchor="middle">Calculate / load</text><path d="M853 313L875 313" stroke="#6c94ac" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="880" y="275" width="163" height="76" rx="8" fill="#17374c" stroke="#438098"/><text x="961" y="306" fill="#edf6ff" font-size="20" text-anchor="middle">Retire</text><text x="961" y="332" fill="#9db2cc" font-size="12" text-anchor="middle">Commit in order</text><rect x="108" y="388" width="430" height="64" rx="8" fill="#102236" stroke="#385775"/><text x="323" y="427" fill="#67e8f9" font-size="16" text-anchor="middle">Registers: immediate working values</text><rect x="564" y="388" width="508" height="64" rx="8" fill="#102236" stroke="#385775"/><text x="818" y="427" fill="#67e8f9" font-size="17" text-anchor="middle">L1 caches + load/store machinery</text><rect x="1132" y="193" width="222" height="130" rx="8" fill="#123044" stroke="#3e7085"/><text x="1243" y="247" fill="#67e8f9" font-size="20" text-anchor="middle">Other core</text><text x="1243" y="278" fill="#9db2cc" font-size="15" text-anchor="middle">Local resources</text><rect x="1132" y="353" width="222" height="136" rx="8" fill="#123044" stroke="#3e7085"/><text x="1243" y="405" fill="#67e8f9" font-size="20" text-anchor="middle">Other core</text><text x="1243" y="438" fill="#9db2cc" font-size="15" text-anchor="middle">Local resources</text><rect x="80" y="517" width="1020" height="57" rx="8" fill="#12293c" stroke="#385775"/><text x="590" y="554" fill="#9db2cc" font-size="18" text-anchor="middle">Core-local L2 cache in this representative design</text><rect x="80" y="605" width="660" height="52" rx="8" fill="#142337" stroke="#385775"/><text x="410" y="639" fill="#67e8f9" font-size="18" text-anchor="middle">Shared last-level cache (often L3)</text><rect x="775" y="605" width="579" height="52" rx="8" fill="#142337" stroke="#385775"/><text x="1064" y="639" fill="#9db2cc" font-size="17" text-anchor="middle">Interconnect / memory controller / PCIe</text><path d="M1065 660L1065 711" stroke="#6c94ac" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="1065" y="746" fill="#70e7bc" font-size="20" text-anchor="middle">External data and devices</text><text x="54" y="790" fill="#9db2cc" font-size="14" text-anchor="start">Prediction guides fetch; real cores overlap stages and may execute work out of order.</text></g></svg>