<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 1440 620" role="img" aria-labelledby="title desc"><title id="title">CPU and GPU work together on a game frame</title><desc id="desc">A simplified frame path runs from CPU simulation and command preparation to GPU rendering and then display. In an explicitly hypothetical overlapped pipeline with CPU work of five milliseconds and GPU work of ten milliseconds per frame, the ideal steady-state limit is about one hundred frames per second, excluding other overhead.</desc><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#29405b" stroke-opacity=".3"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#6c94ac" stroke-width="1.2"/></marker></defs><rect width="1440" height="620" rx="14" fill="#0b1423"/><rect width="1440" height="620" fill="url(#grid)"/><g font-family="Consolas,monospace"><text x="54" y="57" fill="#70e7bc" font-size="15" text-anchor="start">HOW A GAME FRAME REACHES YOUR SCREEN</text><text x="54" y="110" fill="#edf6ff" font-size="29" text-anchor="start">The CPU prepares. The GPU renders. The display presents.</text><rect x="54" y="166" width="392" height="190" rx="8" fill="#10283b" stroke="#2c6179"/><text x="83" y="207" fill="#67e8f9" font-size="27" text-anchor="start">CPU</text><text x="83" y="247" fill="#edf6ff" font-size="18" text-anchor="start">Game logic / simulation</text><text x="83" y="281" fill="#edf6ff" font-size="18" text-anchor="start">Prepare rendering commands</text><text x="83" y="322" fill="#9db2cc" font-size="16" text-anchor="start">Drivers submit work</text><rect x="542" y="166" width="430" height="190" rx="8" fill="#211d37" stroke="#67588e"/><text x="571" y="207" fill="#c4b5fd" font-size="27" text-anchor="start">GPU</text><text x="571" y="247" fill="#edf6ff" font-size="18" text-anchor="start">Geometry / shading / lighting</text><text x="571" y="281" fill="#edf6ff" font-size="18" text-anchor="start">Rasterization or ray tracing</text><text x="571" y="322" fill="#9db2cc" font-size="16" text-anchor="start">Finish image buffers</text><rect x="1068" y="166" width="318" height="190" rx="8" fill="#10332e" stroke="#3b826f"/><text x="1097" y="207" fill="#70e7bc" font-size="25" text-anchor="start">DISPLAY</text><text x="1097" y="251" fill="#edf6ff" font-size="16" text-anchor="start">Present completed frames</text><text x="1097" y="285" fill="#9db2cc" font-size="16" text-anchor="start">Refresh rate matters too</text><path d="M451 264L532 264" stroke="#6c94ac" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M981 264L1058 264" stroke="#6c94ac" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="54" y="401" width="1332" height="109" rx="8" fill="#101f31" stroke="#34536c"/><text x="83" y="437" fill="#9db2cc" font-size="13" text-anchor="start">ILLUSTRATIVE PIPELINED WORKLOAD</text><text x="83" y="478" fill="#67e8f9" font-size="22" text-anchor="start">CPU 5 ms / GPU 10 ms</text><text x="650" y="478" fill="#70e7bc" font-size="20" text-anchor="start">Ideal throughput ≈ 1000 / max(5,10) = 100 FPS</text><text x="54" y="556" fill="#9db2cc" font-size="15" text-anchor="start">The stages can overlap across frames. Timing values are invented, not a benchmark.</text><text x="54" y="594" fill="#9db2cc" font-size="13" text-anchor="start">Real frame pacing also depends on queues, synchronization, transfers, display, and the application.</text></g></svg>