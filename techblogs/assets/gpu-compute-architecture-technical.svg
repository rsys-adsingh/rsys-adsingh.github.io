f" stroke="#6a5690"/><text x="396" y="422" fill="#c4b5fd" font-size="17" text-anchor="start">Compute block</text><rect x="398" y="445" width="43" height="23" rx="3" fill="#61488c" stroke="#9576bc"/><rect x="457" y="445" width="43" height="23" rx="3" fill="#61488c" stroke="#9576bc"/><rect x="516" y="445" width="43" height="23" rx="3" fill="#61488c" stroke="#9576bc"/><rect x="575" y="445" width="43" height="23" rx="3" fill="#61488c" stroke="#9576bc"/><rect x="398" y="478" width="43" height="23" rx="3" fill="#61488c" stroke="#9576bc"/><rect x="457" y="478" width="43" height="23" rx="3" fill="#61488c" stroke="#9576bc"/><rect x="516" y="478" width="43" height="23" rx="3" fill="#61488c" stroke="#9576bc"/><rect x="575" y="478" width="43" height="23" rx="3" fill="#61488c" stroke="#9576bc"/><rect x="724" y="199" width="628" height="347" rx="8" fill="#132b3b" stroke="#3a7187"/><text x="748" y="238" fill="#67e8f9" font-size="21" text-anchor="start">One block, enlarged</text><rect x="748" y="259" width="578" height="48" rx="8" fill="#163c4d" stroke="#3a7187"/><text x="1037" y="290" fill="#67e8f9" font-size="17" text-anchor="middle">Schedulers choose ready thread groups</text><rect x="751" y="329" width="55" height="31" rx="4" fill="#33506e" stroke="#6686a8"/><rect x="824" y="329" width="55" height="31" rx="4" fill="#33506e" stroke="#6686a8"/><rect x="897" y="329" width="55" height="31" rx="4" fill="#33506e" stroke="#6686a8"/><rect x="970" y="329" width="55" height="31" rx="4" fill="#33506e" stroke="#6686a8"/><rect x="1043" y="329" width="55" height="31" rx="4" fill="#33506e" stroke="#6686a8"/><rect x="1116" y="329" width="55" height="31" rx="4" fill="#33506e" stroke="#6686a8"/><rect x="1189" y="329" width="55" height="31" rx="4" fill="#33506e" stroke="#6686a8"/><rect x="1262" y="329" width="55" height="31" rx="4" fill="#33506e" stroke="#6686a8"/><rect x="751" y="375" width="55" height="31" rx="4" fill="#33506e" stroke="#6686a8"/><rect x="824" y="375" width="55" height="31" rx="