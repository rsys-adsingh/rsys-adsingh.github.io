<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850" viewBox="0 0 1440 850" role="img" aria-labelledby="title desc"><title id="title">A conceptual GPU with many compute blocks</title><desc id="desc">Repeated compute blocks contain schedulers, arithmetic resources, registers and fast local memory. A larger memory system and specialized graphics/media engines serve the processor. NVIDIA SM, AMD CU, and Intel Xe-core organizations differ; this picture is not a vendor die layout.</desc><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#29405b" stroke-opacity=".3"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#6c94ac" stroke-width="1.2"/></marker></defs><rect width="1440" height="850" rx="14" fill="#0b1423"/><rect width="1440" height="850" fill="url(#grid)"/><g font-family="Consolas,monospace"><text x="54" y="57" fill="#c4b5fd" font-size="15" text-anchor="start">INSIDE A GPU</text><text x="54" y="110" fill="#edf6ff" font-size="33" text-anchor="start">Keep many groups of work moving.</text><rect x="54" y="161" width="1332" height="525" rx="8" fill="#16162e" stroke="#56497c"/><text x="82" y="201" fill="#c4b5fd" font-size="21" text-anchor="start">Repeated compute blocks</text><rect x="82" y="229" width="270" height="135" rx="8" fill="#27213f" stroke="#6a5690"/><text x="98" y="259" fill="#c4b5fd" font-size="17" text-anchor="start">Compute block</text><rect x="100" y="282" width="43" height="23" rx="3" fill="#61488c" stroke="#9576bc"/><rect x="159" y="282" width="43" height="23" rx="3" fill="#61488c" stroke="#9576bc"/><rect x="218" y="282" width="43" height="23" rx="3" fill="#61488c" stroke="#9576bc"/><rect x="277" y="282" width="43" height="23" rx="3" fill="#61488c" stroke="#9576bc"/><rect x="100" y="315" width="43" height="23" rx="3" fill="#61488c" stroke="#9576bc"/><rect x="159" y="315" width="43" heig