<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="695" viewBox="0 0 1440 695" role="img" aria-labelledby="title desc"><title id="title">Integrated versus discrete GPU memory</title><desc id="desc">In an integrated system, CPU and GPU share physical system memory. In a typical discrete-card desktop, the CPU has system RAM and the GPU has dedicated VRAM, with a connection such as PCIe between them. Unified addressing can be offered by software without eliminating all physical movement costs.</desc><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#29405b" stroke-opacity=".3"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#6c94ac" stroke-width="1.2"/></marker></defs><rect width="1440" height="695" rx="14" fill="#0b1423"/><rect width="1440" height="695" fill="url(#grid)"/><g font-family="Consolas,monospace"><text x="54" y="57" fill="#70e7bc" font-size="15" text-anchor="start">RAM IS NOT THE SAME THING AS VRAM</text><text x="54" y="110" fill="#edf6ff" font-size="30" text-anchor="start">Integrated and discrete graphics move data differently.</text><rect x="54" y="164" width="630" height="415" rx="8" fill="#10283b" stroke="#2c6179"/><rect x="756" y="164" width="630" height="415" rx="8" fill="#211d37" stroke="#67588e"/><text x="84" y="208" fill="#67e8f9" font-size="23" text-anchor="start">Integrated graphics / SoC</text><text x="786" y="208" fill="#c4b5fd" font-size="23" text-anchor="start">Typical discrete graphics card</text><rect x="91" y="248" width="555" height="125" rx="8" fill="#142f42" stroke="#3a7187"/><text x="368" y="278" fill="#9db2cc" font-size="16" text-anchor="middle">One processor package</text><rect x="115" y="298" width="210" height="52" rx="8" fill="#164357" stroke="#458ba0"/><text x="220" y="331" fill="#67e8f9" font-size="22" text-anchor="middle">CPU</text><rect x="412" y="298" width="210" height="52" rx="8" fill="#3c2c5a" stroke="#8066a9"/><text x="517" y="331" fill="#c4b5fd" font-size="22" text-anchor="middle">GPU</text><path d="M220 376L220 444" stroke="#6c94ac" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M517 376L517 444" stroke="#6c94ac" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="138" y="451" width="462" height="70" rx="8" fill="#10332e" stroke="#3b826f"/><text x="369" y="494" fill="#70e7bc" font-size="23" text-anchor="middle">Shared system memory</text><text x="84" y="552" fill="#9db2cc" font-size="16" text-anchor="start">CPU and GPU share physical DRAM capacity.</text><rect x="793" y="274" width="212" height="75" rx="8" fill="#164357" stroke="#458ba0"/><text x="899" y="321" fill="#67e8f9" font-size="22" text-anchor="middle">CPU</text><rect x="1137" y="274" width="212" height="75" rx="8" fill="#3c2c5a" stroke="#8066a9"/><text x="1243" y="321" fill="#c4b5fd" font-size="22" text-anchor="middle">GPU</text><path d="M1015 313L1125 313" stroke="#6c94ac" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="1071" y="286" fill="#9db2cc" font-size="17" text-anchor="middle">PCIe</text><path d="M899 352L899 444" stroke="#6c94ac" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M1243 352L1243 444" stroke="#6c94ac" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="793" y="451" width="212" height="70" rx="8" fill="#10332e" stroke="#3b826f"/><text x="899" y="494" fill="#70e7bc" font-size="22" text-anchor="middle">System RAM</text><rect x="1137" y="451" width="212" height="70" rx="8" fill="#10332e" stroke="#3b826f"/><text x="1243" y="494" fill="#70e7bc" font-size="22" text-anchor="middle">VRAM</text><text x="786" y="552" fill="#9db2cc" font-size="16" text-anchor="start">Separate memories; movement can cost time.</text><text x="54" y="625" fill="#9db2cc" font-size="15" text-anchor="start">Shared memory reduces some transfers; it does not make memory capacity or bandwidth unlimited.</text><text x="54" y="667" fill="#9db2cc" font-size="12" text-anchor="start">SIMPLIFIED / unified address spaces and physical memory organization are different concepts</text></g></svg>