<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="770" viewBox="0 0 1440 770" role="img" aria-labelledby="title desc"><title id="title">Baseline IA-32 and x86-64 architectural registers</title><desc id="desc">IA-32 exposes eight 32-bit general-purpose registers. Baseline x86-64 exposes sixteen 64-bit general-purpose registers, including R8 through R15. These are architectural register views, not physical core counts or a die layout. Optional extensions can add architectural state.</desc><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#29405b" stroke-opacity=".3"/></pattern></defs><rect width="1440" height="770" fill="#0b1423"/><rect width="1440" height="770" fill="url(#grid)"/><g font-family="Consolas,monospace"><text x="54" y="58" fill="#67e8f9" font-size="15" text-anchor="start">x86 ARCHITECTURE / BASELINE REGISTER VIEWS</text><text x="54" y="112" fill="#edf6ff" font-size="31" text-anchor="start">32-bit and 64-bit: width and architectural state.</text><rect x="54" y="163" width="610" height="481" rx="8" fill="#10283b" stroke="#3b687e"/><rect x="776" y="163" width="610" height="481" rx="8" fill="#211d37" stroke="#67588e"/><text x="84" y="213" fill="#67e8f9" font-size="26" text-anchor="start">IA-32 / 32-bit mode</text><text x="806" y="213" fill="#c4b5fd" font-size="26" text-anchor="start">x86-64 / 64-bit mode</text><text x="84" y="258" fill="#edf6ff" font-size="20" text-anchor="start">8 general-purpose registers</text><text x="806" y="258" fill="#edf6ff" font-size="19" text-anchor="start">16 baseline general-purpose registers</text><text x="84" y="293" fill="#9db2cc" font-size="17" text-anchor="start">Each has a 32-bit architectural view.</text><text x="806" y="293" fill="#9db2cc" font-size="17" text-anchor="start">Each has a 64-bit architectural view.</text><rect x="84" y="321" width="246" height="39" rx="8" fill="#153c50" stroke="#438098"/><text x="207" y="347" fill="#67e8f9" font-size="20" text-anchor="middle">EAX</text><rect x="359" y="321" width="246" height="39" rx="8" fill="#153c50" stroke="#438098"/><text x="482" y="347" fill="#67e8f9" font-size="20" text-anchor="middle">EBX</text><rect x="84" y="375" width="246" height="39" rx="8" fill="#153c50" stroke="#438098"/><text x="207" y="401" fill="#67e8f9" font-size="20" text-anchor="middle">ECX</text><rect x="359" y="375" width="246" height="39" rx="8" fill="#153c50" stroke="#438098"/><text x="482" y="401" fill="#67e8f9" font-size="20" text-anchor="middle">EDX</text><rect x="84" y="429" width="246" height="39" rx="8" fill="#153c50" stroke="#438098"/><text x="207" y="455" fill="#67e8f9" font-size="20" text-anchor="middle">ESI</text><rect x="359" y="429" width="246" height="39" rx="8" fill="#153c50" stroke="#438098"/><text x="482" y="455" fill="#67e8f9" font-size="20" text-anchor="middle">EDI</text><rect x="84" y="483" width="246" height="39" rx="8" fill="#153c50" stroke="#438098"/><text x="207" y="509" fill="#67e8f9" font-size="20" text-anchor="middle">EBP</text><rect x="359" y="483" width="246" height="39" rx="8" fill="#153c50" stroke="#438098"/><text x="482" y="509" fill="#67e8f9" font-size="20" text-anchor="middle">ESP</text><rect x="806" y="321" width="120" height="39" rx="8" fill="#392b56" stroke="#8066a9"/><text x="866" y="347" fill="#c4b5fd" font-size="18" text-anchor="middle">RAX</text><rect x="945" y="321" width="120" height="39" rx="8" fill="#392b56" stroke="#8066a9"/><text x="1005" y="347" fill="#c4b5fd" font-size="18" text-anchor="middle">RBX</text><rect x="1084" y="321" width="120" height="39" rx="8" fill="#392b56" stroke="#8066a9"/><text x="1144" y="347" fill="#c4b5fd" font-size="18" text-anchor="middle">RCX</text><rect x="1223" y="321" width="120" height="39" rx="8" fill="#392b56" stroke="#8066a9"/><text x="1283" y="347" fill="#c4b5fd" font-size="18" text-anchor="middle">RDX</text><rect x="806" y="375" width="120" height="39" rx="8" fill="#392b56" stroke="#8066a9"/><text x="866" y="401" fill="#c4b5fd" font-size="18" text-anchor="middle">RSI</text><rect x="945" y="375" width="120" height="39" rx="8" fill="#392b56" stroke="#8066a9"/><text x="1005" y="401" fill="#c4b5fd" font-size="18" text-anchor="middle">RDI</text><rect x="1084" y="375" width="120" height="39" rx="8" fill="#392b56" stroke="#8066a9"/><text x="1144" y="401" fill="#c4b5fd" font-size="18" text-anchor="middle">RBP</text><rect x="1223" y="375" width="120" height="39" rx="8" fill="#392b56" stroke="#8066a9"/><text x="1283" y="401" fill="#c4b5fd" font-size="18" text-anchor="middle">RSP</text><rect x="806" y="429" width="120" height="39" rx="8" fill="#392b56" stroke="#8066a9"/><text x="866" y="455" fill="#c4b5fd" font-size="18" text-anchor="middle">R8</text><rect x="945" y="429" width="120" height="39" rx="8" fill="#392b56" stroke="#8066a9"/><text x="1005" y="455" fill="#c4b5fd" font-size="18" text-anchor="middle">R9</text><rect x="1084" y="429" width="120" height="39" rx="8" fill="#392b56" stroke="#8066a9"/><text x="1144" y="455" fill="#c4b5fd" font-size="18" text-anchor="middle">R10</text><rect x="1223" y="429" width="120" height="39" rx="8" fill="#392b56" stroke="#8066a9"/><text x="1283" y="455" fill="#c4b5fd" font-size="18" text-anchor="middle">R11</text><rect x="806" y="483" width="120" height="39" rx="8" fill="#392b56" stroke="#8066a9"/><text x="866" y="509" fill="#c4b5fd" font-size="18" text-anchor="middle">R12</text><rect x="945" y="483" width="120" height="39" rx="8" fill="#392b56" stroke="#8066a9"/><text x="1005" y="509" fill="#c4b5fd" font-size="18" text-anchor="middle">R13</text><rect x="1084" y="483" width="120" height="39" rx="8" fill="#392b56" stroke="#8066a9"/><text x="1144" y="509" fill="#c4b5fd" font-size="18" text-anchor="middle">R14</text><rect x="1223" y="483" width="120" height="39" rx="8" fill="#392b56" stroke="#8066a9"/><text x="1283" y="509" fill="#c4b5fd" font-size="18" text-anchor="middle">R15</text><rect x="84" y="558" width="262" height="49" rx="8" fill="#17435a" stroke="#438098"/><text x="215" y="590" fill="#67e8f9" font-size="22" text-anchor="middle">32 bits</text><rect x="806" y="558" width="540" height="49" rx="8" fill="#3b2d59" stroke="#8066a9"/><text x="1076" y="590" fill="#c4b5fd" font-size="22" text-anchor="middle">64 bits</text><text x="54" y="694" fill="#9db2cc" font-size="18" text-anchor="start">Both designs fetch, decode, and execute instructions. Width is not a count of CPU cores.</text><text x="54" y="739" fill="#9db2cc" font-size="12" text-anchor="start">Baseline architectural registers shown; physical rename registers, SIMD state, and optional extensions are omitted.</text></g></svg>