<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc"><title id="title">CPU and GPU: complementary processor designs</title><desc id="desc">A CPU is shown with a few complex processing blocks, while a GPU is shown with groups of arithmetic lanes. The counts are illustrative. CPUs emphasize responsive flexible work and GPUs emphasize throughput for suitable parallel workloads.</desc><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#29405b" stroke-opacity=".3"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#6c94ac" stroke-width="1.2"/></marker></defs><rect width="1440" height="720" rx="14" fill="#0b1423"/><rect width="1440" height="720" fill="url(#grid)"/><g font-family="Consolas,monospace"><text x="54" y="57" fill="#67e8f9" font-size="15" text-anchor="start">TWO PROCESSOR DESIGNS / DIFFERENT EXECUTION PRIORITIES</text><text x="54" y="111" fill="#edf6ff" font-size="33" text-anchor="start">CPU + GPU: different strengths, one system.</text><rect x="54" y="170" width="610" height="365" rx="8" fill="#10283b" stroke="#2c6179"/><rect x="776" y="170" width="610" height="365" rx="8" fill="#211d37" stroke="#67588e"/><text x="84" y="214" fill="#67e8f9" font-size="29" text-anchor="start">CPU</text><text x="84" y="251" fill="#edf6ff" font-size="21" text-anchor="start">Fast decisions. Flexible work.</text><text x="806" y="214" fill="#c4b5fd" font-size="29" text-anchor="start">GPU</text><text x="806" y="251" fill="#edf6ff" font-size="21" text-anchor="start">Many similar operations in flight.</text><text x="720" y="360" fill="#9db2cc" font-size="44" text-anchor="middle">+</text><rect x="84" y="281" width="240" height="65" rx="8" fill="#13374b" stroke="#3c8094"/><text x="204" y="321" fill="#67e8f9" font-size="20" text-anchor="middle">Complex core</text><rect x="354" y="281" width="240" height="65" rx="8" fill="#13374b" stroke="#3c8094"/><text x="474" y="321" fill="#67e8f9" font-size="20" text-anchor="middle">Complex core</text><rect x="84" y="368" width="240" height="65" rx="8" fill="#13374b" stroke="#3c8094"/><text x="204" y="408" fill="#67e8f9" font-size="20" text-anchor="middle">Complex core</text><rect x="354" y="368" width="240" height="65" rx="8" fill="#13374b" stroke="#3c8094"/><text x="474" y="408" fill="#67e8f9" font-size="20" text-anchor="middle">Complex core</text><rect x="84" y="455" width="510" height="50" rx="8" fill="#142337" stroke="#3c526b"/><text x="339" y="488" fill="#9db2cc" font-size="17" text-anchor="middle">Control + prediction + cache</text><rect x="806" y="283" width="39" height="25" rx="3" fill="#574183" stroke="#8066a9"/><rect x="859" y="283" width="39" height="25" rx="3" fill="#574183" stroke="#8066a9"/><rect x="912" y="283" width="39" height="25" rx="3" fill="#574183" stroke="#8066a9"/><rect x="965" y="283" width="39" height="25" rx="3" fill="#574183" stroke="#8066a9"/><rect x="1018" y="283" width="39" height="25" rx="3" fill="#574183" stroke="#8066a9"/><rect x="1071" y="283" width="39" height="25" rx="3" fill="#574183" stroke="#8066a9"/><rect x="1124" y="283" width="39" height="25" rx="3" fill="#574183" stroke="#8066a9"/><rect x="1177" y="283" width="39" height="25" rx="3" fill="#574183" stroke="#8066a9"/><rect x="1230" y="283" width="39" height="25" rx="3" fill="#574183" stroke="#8066a9"/><rect x="1283" y="283" width="39" height="25" rx="3" fill="#574183" stroke="#8066a9"/><rect x="806" y="321" width="39" height="25" rx="3" fill="#574183" stroke="#8066a9"/><rect x="859" y="321" width="39" height="25" rx="3" fill="#574183" stroke="#8066a9"/><rect x="912" y="321" width="39" height="25" rx="3" fill="#574183" stroke="#8066a9"/><rect x="965" y="321" width="39" height="25" rx="3" fill="#574183" stroke="#8066a9"/><rect x="1018" y="321" width="39" height="25" rx="3" fill="#574183" stroke="#8066a9"/><rect x="1071" y="321" width="39" height="25" rx="3" fill="#574183" stroke="#8066a9"/><rect x="1124" y="321" width="39" height="25" rx="3" fill="#574183" stroke="#8066a9"/><rect x="1177" y="321" width="39" height="25" rx="3" fill="#574183" stroke="#8066a9"/><rect x="1230" y="321" width="39" height="25" rx="3" fill="#574183" stroke="#8066a9"/><rect x="1283" y="321" width="39" height="25" rx="3" fill="#574183" stroke="#8066a9"/><rect x="806" y="359" width="39" height="25" rx="3" fill="#574183" stroke="#8066a9"/><rect x="859" y="359" width="39" height="25" rx="3" fill="#574183" stroke="#8066a9"/><rect x="912" y="359" width="39" height="25" rx="3" fill="#574183" stroke="#8066a9"/><rect x="965" y="359" width="39" height="25" rx="3" fill="#574183" stroke="#8066a9"/><rect x="1018" y="359" width="39" height="25" rx="3" fill="#574183" stroke="#8066a9"/><rect x="1071" y="359" width="39" height="25" rx="3" fill="#574183" stroke="#8066a9"/><rect x="1124" y="359" width="39" height="25" rx="3" fill="#574183" stroke="#8066a9"/><rect x="1177" y="359" width="39" height="25" rx="3" fill="#574183" stroke="#8066a9"/><rect x="1230" y="359" width="39" height="25" rx="3" fill="#574183" stroke="#8066a9"/><rect x="1283" y="359" width="39" height="25" rx="3" fill="#574183" stroke="#8066a9"/><rect x="806" y="397" width="39" height="25" rx="3" fill="#574183" stroke="#8066a9"/><rect x="859" y="397" width="39" height="25" rx="3" fill="#574183" stroke="#8066a9"/><rect x="912" y="397" width="39" height="25" rx="3" fill="#574183" stroke="#8066a9"/><rect x="965" y="397" width="39" height="25" rx="3" fill="#574183" stroke="#8066a9"/><rect x="1018" y="397" width="39" height="25" rx="3" fill="#574183" stroke="#8066a9"/><rect x="1071" y="397" width="39" height="25" rx="3" fill="#574183" stroke="#8066a9"/><rect x="1124" y="397" width="39" height="25" rx="3" fill="#574183" stroke="#8066a9"/><rect x="1177" y="397" width="39" height="25" rx="3" fill="#574183" stroke="#8066a9"/><rect x="1230" y="397" width="39" height="25" rx="3" fill="#574183" stroke="#8066a9"/><rect x="1283" y="397" width="39" height="25" rx="3" fill="#574183" stroke="#8066a9"/><rect x="806" y="435" width="39" height="25" rx="3" fill="#574183" stroke="#8066a9"/><rect x="859" y="435" width="39" height="25" rx="3" fill="#574183" stroke="#8066a9"/><rect x="912" y="435" width="39" height="25" rx="3" fill="#574183" stroke="#8066a9"/><rect x="965" y="435" width="39" height="25" rx="3" fill="#574183" stroke="#8066a9"/><rect x="1018" y="435" width="39" height="25" rx="3" fill="#574183" stroke="#8066a9"/><rect x="1071" y="435" width="39" height="25" rx="3" fill="#574183" stroke="#8066a9"/><rect x="1124" y="435" width="39" height="25" rx="3" fill="#574183" stroke="#8066a9"/><rect x="1177" y="435" width="39" height="25" rx="3" fill="#574183" stroke="#8066a9"/><rect x="1230" y="435" width="39" height="25" rx="3" fill="#574183" stroke="#8066a9"/><rect x="1283" y="435" width="39" height="25" rx="3" fill="#574183" stroke="#8066a9"/><text x="806" y="505" fill="#c4b5fd" font-size="17" text-anchor="start">Groups of arithmetic execution lanes</text><text x="54" y="584" fill="#67e8f9" font-size="19" text-anchor="start">Latency: how soon one task finishes.</text><text x="776" y="584" fill="#c4b5fd" font-size="19" text-anchor="start">Throughput: how much work finishes.</text><text x="54" y="632" fill="#9db2cc" font-size="18" text-anchor="start">Both can run parallel work. Their designs favor different workloads.</text><text x="54" y="681" fill="#9db2cc" font-size="12" text-anchor="start">CONCEPTUAL IMAGE / block counts and area are illustrative, not product specifications</text></g></svg>