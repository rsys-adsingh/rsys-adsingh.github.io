<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="700" viewBox="0 0 1440 700" role="img" aria-labelledby="title desc"><title id="title">CPU hardware, OS kernel, and program bitness</title><desc id="desc">A 64-bit-capable x86 processor can run a 64-bit kernel with both a 64-bit application and a 32-bit application when compatibility support and required libraries exist. A four-byte pointer in one application does not prove that the CPU is 32-bit-only.</desc><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#29405b" stroke-opacity=".3"/></pattern></defs><rect width="1440" height="700" fill="#0b1423"/><rect width="1440" height="700" fill="url(#grid)"/><g font-family="Consolas,monospace"><text x="54" y="58" fill="#67e8f9" font-size="15" text-anchor="start">CPU CAPABILITY IS NOT THE SAME AS PROGRAM BITNESS</text><text x="54" y="111" fill="#edf6ff" font-size="30" text-anchor="start">One 64-bit x86 CPU can host different application modes.</text><rect x="54" y="169" width="1332" height="104" rx="8" fill="#10283b" stroke="#3b687e"/><text x="720" y="212" fill="#67e8f9" font-size="26" text-anchor="middle">Hardware: x86-64-capable CPU</text><text x="720" y="248" fill="#9db2cc" font-size="18" text-anchor="middle">Provides supported execution modes</text><rect x="54" y="305" width="1332" height="83" rx="8" fill="#10283b" stroke="#3b687e"/><text x="720" y="355" fill="#edf6ff" font-size="24" text-anchor="middle">64-bit OS kernel + enabled compatibility support</text><rect x="54" y="427" width="610" height="144" rx="8" fill="#10283b" stroke="#3b687e"/><rect x="776" y="427" width="610" height="144" rx="8" fill="#211d37" stroke="#67588e"/><text x="84" y="470" fill="#67e8f9" font-size="25" text-anchor="start">32-bit executable</text><text x="84" y="510" fill="#9db2cc" font-size="17" text-anchor="start">32-bit loader / libraries when required</text><text x="84" y="545" fill="#67e8f9" font-size="20" text-anchor="start">Typical ILP32 pointer: 4 bytes</text><text x="806" y="470" fill="#c4b5fd" font-size="25" text-anchor="start">64-bit executable</text><text x="806" y="510" fill="#9db2cc" font-size="17" text-anchor="start">64-bit loader / libraries</text><text x="806" y="545" fill="#c4b5fd" font-size="20" text-anchor="start">Typical LP64 pointer: 8 bytes</text><text x="54" y="622" fill="#70e7bc" font-size="18" text-anchor="start">sizeof(void*) reports the current program ABI, not the CPU maximum capability.</text><text x="54" y="667" fill="#9db2cc" font-size="12" text-anchor="start">Conceptual GNU/Linux x86 layout. Compatibility depends on CPU, kernel configuration, and runtime support.</text></g></svg>