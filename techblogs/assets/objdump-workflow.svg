<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 1440 620" role="img" aria-labelledby="title desc"><title id="title">One ELF file, three objdump views</title><desc id="desc">objdump -h lists section metadata. objdump -d decodes code bytes into assembly. objdump -s displays raw bytes. A single object contains text, data, rodata and bss; bss has memory size but no file contents.</desc><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#244361" stroke-opacity=".3"/></pattern></defs><rect width="1440" height="620" rx="14" fill="#0b1423"/><rect width="1440" height="620" fill="url(#grid)"/><g font-family="Consolas,monospace"><text x="54" y="60" font-size="15" letter-spacing="3" fill="#67e8f9">INSIDE THE BINARY</text><text x="54" y="110" font-size="34" font-weight="bold" fill="#edf6ff">One ELF file. Three useful views.</text><text x="54" y="149" font-size="17" fill="#91a9c4">Choose the question first, then choose the flag.</text><rect x="54" y="196" width="350" height="270" rx="10" fill="#141b34" stroke="#6556a1"/><rect x="545" y="196" width="350" height="270" rx="10" fill="#0b2935" stroke="#28788a"/><rect x="1036" y="196" width="350" height="270" rx="10" fill="#102d29" stroke="#338a76"/><text x="80" y="239" font-size="22" fill="#c4b5fd">objdump -h</text><text x="571" y="239" font-size="22" fill="#67e8f9">objdump -d</text><text x="1062" y="239" font-size="22" fill="#70e7bc">objdump -s</text><g font-size="18" fill="#d8e7f5"><text x="80" y="289">.text    CODE</text><text x="80" y="325">.data    DATA</text><text x="80" y="361">.rodata  READONLY</text><text x="80" y="397">.bss     ALLOC</text><text x="571" y="289">55        push rbp</text><text x="571" y="325">48 89 e5  mov rbp,rsp</text><text x="571" y="361">01 d0     add eax,edx</text><text x="571" y="397">c3        ret</text><text x="1062" y="289">.data</text><text x="1062" y="325">07 00 00 00  = 7</text><text x="1062" y="371">.rodata</text><text x="1062" y="407">48 69 00     Hi.</text></g><path d="M54 505H1386" stroke="#294159"/><text x="54" y="546" font-size="17" fill="#9cb4ce">SECTION METADATA</text><text x="545" y="546" font-size="17" fill="#9cb4ce">BYTES DECODED AS CODE</text><text x="1036" y="546" font-size="17" fill="#9cb4ce">BYTES DISPLAYED AS DATA</text><text x="54" y="589" font-size="12" fill="#7893af">ILLUSTRATIVE ELF64 / x86-64 Intel syntax / .bss reserves memory without stored section bytes</text></g></svg>